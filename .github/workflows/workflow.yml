name: flake checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'main'
      - 'ci*'

permissions:
  contents: read

jobs:
  check-fmt:
    uses: ./.github/workflows/check-agnostic.yml
    with:
      check: fmt
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  check-deny:
    uses: ./.github/workflows/check-agnostic.yml
    with:
      check: deny
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  check-clippy:
    uses: ./.github/workflows/check-agnostic.yml
    with:
      check: clippy
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    needs: [check-fmt, check-deny]
  check-default-linux:
    uses: ./.github/workflows/check-linux.yml
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    needs: [check-fmt, check-deny]
  check-default-macos:
    uses: ./.github/workflows/check-macos.yml
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    needs: [check-fmt, check-deny]
  artifact-linux:
    uses: ./.github/workflows/artifact-linux.yml
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    needs: [check-default-linux]
  artifact-macos:
    uses: ./.github/workflows/artifact-macos.yml
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    needs: [check-default-macos]
